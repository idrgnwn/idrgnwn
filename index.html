  The speak bar ("Click here to speak") is deliberately absent — it is the one

    <!-- ── Hero: hologram, wordmark, tagline ──────────────────────────────
       `.jarvis-hero` declares no width on purpose. It is a fit-content block in
       a centered flex column, so it sizes to the tagline's max-content width
       (518.48px at 54 characters of 16px Roboto Mono) plus 2x10px padding.
       Every character of the tagline is worth 9.6px of hero width — editing
       that string moves the hologram's whole column. -->
    <div class="jarvis-hero">
      <div class="jarvis-hologram-row">
        <!-- The aura layers below paint this same image, blurred and scaled, to
           form a head-shaped halo. Their copy of the path lives in styles.css
           (`--jarvis-head-src`) rather than in a style attribute here: a
           relative url() inside a custom property is resolved against the
           stylesheet that consumes it, not against this document, so declaring
           it here made the browser ask for assets/css/assets/img/… and 404. -->
        <div class="jarvis-hologram-stage">
          <div class="jarvis-hologram">
            <span class="jarvis-hologram-aura jarvis-hologram-aura--far" aria-hidden="true"></span>
            <span class="jarvis-hologram-aura jarvis-hologram-aura--near" aria-hidden="true"></span>
            <img src="assets/img/jarvis-neural-head.webp" alt="image" width="350" height="350">
          </div>
        </div>
      </div>

      <h1 class="jarvis-wordmark">RajaSetan</h1>

      <!--
      The tagline is typed out one character at a time by assets/js/typewriter.js.
      The finished sentence is ALWAYS in the DOM, in `.jarvis-tagline-ghost`
      (visibility:hidden), because the hero's width is this string's max-content
      width — revealing the text by growing a substring would re-measure the hero
      on every keystroke and visibly resize the whole column, hologram included.
      `.jarvis-tagline-typed` is absolutely positioned over that ghost, so the
      visible characters can never feed back into layout.

      Keep the ghost on one line. Its textContent is what typewriter.js types,
      so a line break inside it becomes a newline plus indent in the typed
      output, and it must stay character-identical to the .sr-only copy below.

      The 40px bottom margin is the gap the speak bar used to occupy. It is kept
      rather than zeroed so the hero block keeps its original box.
    -->

      <p class="jarvis-tagline">
        <span class="jarvis-tagline-ghost" aria-hidden="true">Hello stranger, I am the assistant to the leader of all Autobots.</span>
        <span class="jarvis-tagline-typed" aria-hidden="true"><span class="jarvis-caret"></span></span>
        <span class="sr-only">Hello stranger, I am the assistant to the leader of all Autobots.</span>
      </p>

      <!-- With JS off the overlay never fills in, so reveal the ghost instead —
         the sentence is already in the markup, it is only hidden. -->
      <noscript>
        <style>
          .jarvis-tagline-ghost {
            visibility: visible
          }

          .jarvis-caret {
            display: none
          }
        </style>
      </noscript>
    </div>
